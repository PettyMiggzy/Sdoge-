[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pinned for reproducible bytecode (audit finding D-3): the CREATE2 salt
# HookMiner finds is only valid for the EXACT init code it was mined
# against, and solc version / evm_version / metadata all change that init
# code. Unpinned, forge's auto-selected solc version can differ between
# runs. Mine and deploy using this exact toolchain; if any of these values
# ever change, re-mine before deploying.
solc = "0.8.26"
evm_version = "cancun"     # v4-core uses transient storage (TSTORE/TLOAD)
# The bytecode carries the IPFS hash of this build's metadata, which covers
# every source file byte for byte, so Sourcify and the explorer can prove
# an exact match to these sources and names. The catch: any source edit,
# even a comment, changes the init code, so the deploy script mines the
# hook salt from the build it deploys. Never reuse a salt across builds.
bytecode_hash = "ipfs"
cbor_metadata = true

via_ir = true
optimizer = true
optimizer_runs = 200

# No ffi anywhere in this repo (audit findings D-4/D-6): hook mining uses
# Uniswap's own pure-Solidity HookMiner library, not an external process.
ffi = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
