name: SDOGE Staking Keeper

# DISABLED: no schedule. This keeper was built for a tax-wallet funding plan that isn't used
# (the tax wallet is a contract with no private key, and the audit found the git-committed
# state can double-send). Staking is funded by the Safe from NFT profits; see
# contracts/README.md. Kept only as reference; don't re-enable it without the fixes listed in
# treasury/README.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, do not send a transaction)"
        type: boolean
        default: false

concurrency:
  group: sdoge-staking-keeper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fund-staking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: treasury
        run: npm install --omit=dev

      - name: Run staking funding keeper
        working-directory: treasury
        env:
          ARC_RPC_URL: ${{ vars.ARC_RPC_URL }}
          ARC_RPC_FALLBACK_URL: ${{ secrets.ARC_RPC_FALLBACK_URL }}
          TAX_WALLET_PRIVATE_KEY: ${{ secrets.TAX_WALLET_PRIVATE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node fund-staking.js

      - name: Persist state if it changed
        run: |
          git config user.name "sdoge-treasury-keeper"
          git config user.email "actions@users.noreply.github.com"
          git add treasury/state.json
          git diff --cached --quiet || git commit -m "chore: update treasury keeper state [skip ci]"
          git push
