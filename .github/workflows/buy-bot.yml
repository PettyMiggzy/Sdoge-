name: SDOGE Buy Bot

# Manual/emergency fallback only. The bot's primary home is now a
# long-lived pm2 process on its own server (see bot/README.md) - a
# process that never exits doesn't have the gaps this schedule trigger
# had (confirmed against real run history: only 2 of 18 runs were ever
# genuine `schedule` events; GH Actions' cron was leaving up to ~an hour
# of dead air between runs). No `schedule:` trigger here anymore, on
# purpose - running both at once would double-post every buy.
on:
  workflow_dispatch: {}

concurrency:
  group: sdoge-buy-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run buy bot (polling loop)
        working-directory: bot
        env:
          ARC_RPC_URL: ${{ vars.ARC_RPC_URL }}
          ARC_RPC_WSS_URL: ${{ vars.ARC_RPC_WSS_URL }}
          ARC_RPC_FALLBACK_URL: ${{ secrets.ARC_RPC_FALLBACK_URL }}
          SDOGE_TOKEN_ADDRESS: ${{ vars.SDOGE_TOKEN_ADDRESS }}
          POOL_ADDRESS: ${{ vars.POOL_ADDRESS }}
          UNIVERSAL_ROUTER_ADDRESS: ${{ vars.UNIVERSAL_ROUTER_ADDRESS }}
          TOKEN_DECIMALS: ${{ vars.TOKEN_DECIMALS }}
          MIN_BUY_TOKENS: ${{ vars.MIN_BUY_TOKENS }}
          EXCLUDE_TO_ADDRESSES: ${{ vars.EXCLUDE_TO_ADDRESSES }}
          BUY_URL: ${{ vars.BUY_URL }}
          CHART_URL: ${{ vars.CHART_URL }}
          BUY_TIER_1: ${{ vars.BUY_TIER_1 }}
          BUY_TIER_2: ${{ vars.BUY_TIER_2 }}
          BUY_TIER_3: ${{ vars.BUY_TIER_3 }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # buy-bot.js's default mode is now an infinite loop (built for
          # pm2) - this step's own while-loop below still expects the old
          # one-pass-then-exit behavior, so ask for that explicitly.
          RUN_ONCE: "true"
        # GitHub Actions cron can't fire more often than every 5 minutes, so
        # each 5-minute tick instead loops internally for ~4m10s, re-checking
        # every 25s, then exits with enough buffer before the next tick to
        # avoid overlap. state.json only needs to hit disk each iteration —
        # it's committed to git once, after the loop, by the next step.
        #
        # `|| true` on the node call matters: this step runs under `bash -e`,
        # so a single transient failure (e.g. a 429 from Arc's public RPC)
        # would otherwise abort the *entire* step immediately, wasting every
        # remaining retry in this 4m10s window instead of just skipping to
        # the next one 25s later. state.json is only ever saved after a
        # fully successful pass, so a skipped iteration can't lose or
        # double-count a block range — the next iteration just re-checks it.
        run: |
          end=$((SECONDS + 250))
          while [ $SECONDS -lt $end ]; do
            node buy-bot.js || echo "::warning::buy-bot.js exited non-zero this iteration (likely a transient RPC error) — retrying in 25s"
            sleep 25
          done

      - name: Persist state if it changed
        # A push here can lose the race against any other commit landing on
        # this branch mid-run (a dev push, or an overlapping run) — seen for
        # real: run #17 posted its alert fine but its `git push` got a plain
        # "fetch first" rejection. Retry with rebase instead of failing the
        # whole job over a state-file conflict that a re-fetch trivially
        # resolves.
        run: |
          git config user.name "sdoge-buy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bot/state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update buy-bot state [skip ci]"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (likely a concurrent commit to this branch) — rebasing and retrying ($i/5)..."
            git pull --rebase origin "$GITHUB_REF_NAME" || { echo "::error::Rebase failed - a real conflict on bot/state.json"; exit 1; }
          done
          echo "::error::Could not push buy-bot state after 5 attempts"
          exit 1
